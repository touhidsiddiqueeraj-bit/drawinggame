<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7C4DFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Draw &amp; Learn">
  <meta name="description" content="A joyful tracing game for toddlers — draw animals, objects, shapes, letters and numbers with colors, sparkles, sounds and cheerful voices.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Draw &amp; Learn! — Toddler Tracing Fun</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===================== HOME ===================== -->
    <section class="screen active" id="screen-home">
      <div class="bg-decor" aria-hidden="true">
        <span class="float-shape fs-cloud" style="--d:0s;  left:6%;  top:12%"></span>
        <span class="float-shape fs-cloud" style="--d:2.5s; left:64%; top:8%"></span>
        <span class="float-shape fs-star"  style="--d:1s;  left:82%; top:26%"></span>
        <span class="float-shape fs-star"  style="--d:3.4s; left:10%; top:64%"></span>
        <span class="float-shape fs-dot"   style="--d:.6s;  left:78%; top:70%"></span>
        <span class="float-shape fs-dot"   style="--d:2s;  left:18%; top:34%"></span>
        <span class="float-shape fs-rainbow" style="--d:1.6s; left:50%; top:88%"></span>
      </div>

      <button class="icon-btn music-btn" id="btn-music-home" aria-label="Music on or off"><span class="music-note">&#127925;</span></button>

      <div class="home-inner">
        <div class="mascot" id="mascot" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <g class="mascot-bounce">
              <polygon class="star-body" points="60,6 74,42 113,44 83,68 93,106 60,85 27,106 37,68 7,44 46,42"/>
              <circle class="eye" cx="48" cy="56" r="6.5"/>
              <circle class="eye" cx="72" cy="56" r="6.5"/>
              <circle class="eye-shine" cx="50.5" cy="53.5" r="2.2"/>
              <circle class="eye-shine" cx="74.5" cy="53.5" r="2.2"/>
              <path class="smile" d="M46 68 Q60 82 74 68"/>
              <circle class="blush" cx="38" cy="66" r="5"/>
              <circle class="blush" cx="82" cy="66" r="5"/>
            </g>
          </svg>
        </div>

        <h1 class="game-title" aria-label="Draw and Learn">
          <span class="tl"><b style="--i:0;--c:#FF5252">D</b><b style="--i:1;--c:#FF9800">r</b><b style="--i:2;--c:#F9A825">a</b><b style="--i:3;--c:#43A047">w</b></span>
          <span class="tl"><b style="--i:4;--c:#00ACC1">&amp;</b></span>
          <span class="tl"><b style="--i:5;--c:#1E88E5">L</b><b style="--i:6;--c:#5E35B1">e</b><b style="--i:7;--c:#D81B60">a</b><b style="--i:8;--c:#F4511E">r</b><b style="--i:9;--c:#00897B">n</b></span>
          <span class="tl">!</span>
        </h1>
        <p class="tagline">Trace animals, objects, shapes, letters &amp; numbers!</p>

        <div class="category-list" id="category-list"></div>

        <div class="mode-setting" id="mode-setting">
          <div class="mode-title">&#127918; How to finish a picture</div>
          <div class="mode-toggle" id="mode-toggle">
            <button class="mode-btn" data-mode="auto" type="button">
              <span class="mode-emoji">&#9889;</span>
              <span class="mode-txt"><b>Auto-go</b><i>Hop to the next one at 80%</i></span>
            </button>
            <button class="mode-btn" data-mode="stars" type="button">
              <span class="mode-emoji">&#11088;</span>
              <span class="mode-txt"><b>Stars + &#10003; Done</b><i>Trace more for &#11088;&#11088;&#11088;, then tap Done</i></span>
            </button>
          </div>
        </div>
      </div>

      <p class="foot-note">Made with &#10084;&#65039; for little artists</p>
    </section>

    <!-- ===================== PICKER ===================== -->
    <section class="screen" id="screen-picker">
      <header class="topbar">
        <button class="icon-btn back-btn" id="btn-back-picker" aria-label="Back">&#11013;&#65039;</button>
        <div class="topbar-title" id="picker-title">Shapes</div>
        <div class="topbar-spacer"></div>
      </header>
      <div class="case-toggle hidden" id="case-toggle">
        <button class="case-btn" id="case-big" type="button">&#128292; Big A</button>
        <button class="case-btn" id="case-small" type="button">&#128293; small a</button>
      </div>
      <p class="picker-hint" id="picker-hint">Tap a picture to play!</p>
      <div class="grid" id="picker-grid"></div>
    </section>

    <!-- ===================== DRAW ===================== -->
    <section class="screen" id="screen-draw">
      <header class="topbar">
        <button class="icon-btn back-btn" id="btn-back-draw" aria-label="Back">&#11013;&#65039;</button>
        <div class="topbar-title name-pill" id="draw-name">A</div>
        <button class="icon-btn sound-btn" id="btn-sound" aria-label="Play the sound">&#128063;</button>
        <button class="icon-btn replay-btn" id="btn-replay" aria-label="Hear it again">&#128266;</button>
        <button class="icon-btn music-btn" id="btn-music-draw" aria-label="Music on or off"><span class="music-note">&#127925;</span></button>
      </header>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-star" id="progress-star">&#11088;</div>
        </div>
      </div>

      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="draw-canvas"></canvas>
        <button class="float-btn hint-btn" id="btn-hint" aria-label="Show me">&#129668;</button>
        <button class="float-btn clear-btn" id="btn-clear" aria-label="Start over">&#129529;</button>
        <button class="float-btn done-btn hidden" id="btn-done" aria-label="Done!">&#9989;</button>
      </div>

      <div class="palette-bar" id="palette-bar"></div>
    </section>
  </div>

  <!-- full-screen particle layer (confetti / sparkles) -->
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- celebration overlay -->
  <div id="celebration" class="hidden" aria-hidden="true">
    <div class="celebrate-card" id="celebrate-card">
      <div class="celebrate-emoji" id="celebrate-emoji">&#11088;</div>
      <div class="celebrate-stars" id="celebrate-stars">&#11088;&#11088;&#11088;</div>
      <div class="celebrate-text" id="celebrate-text">Great job!</div>
      <div class="celebrate-caption" id="celebrate-caption">You drew the circle!</div>
      <button class="big-btn next-btn" id="btn-next">&#128074; Next!</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
